name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-config:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          shopt -s nullglob
          files=(docker/*.yml docker/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "No compose files yet"; exit 0; fi
          for f in "${files[@]}"; do docker compose -f "$f" config -q; done

  shellcheck:
    name: Shell scripts pass shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "No scripts yet"; exit 0; fi
          shellcheck "${files[@]}"
