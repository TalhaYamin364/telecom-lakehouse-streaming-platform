name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-config:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          shopt -s nullglob
          files=(docker/*.yml docker/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "No compose files yet"; exit 0; fi
          for f in "${files[@]}"; do docker compose -f "$f" config -q; done

  shellcheck:
    name: Shell scripts pass shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "No scripts yet"; exit 0; fi
          shellcheck "${files[@]}"

  unit-tests:
    name: Generator unit tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run the generator tests
        run: python3 -m unittest discover -s generator

  dag-tests:
    name: DAGs load and keep their safety settings
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.1.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: docker/airflow/Dockerfile
      - name: Install Airflow with its constraints file
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.10.txt"
      - name: Run the DAG tests
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: python3 -m unittest discover -s airflow/tests -v
