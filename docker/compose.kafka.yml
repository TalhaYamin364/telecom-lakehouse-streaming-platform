name: telecom-kafka

services:
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    hostname: kafka
    # shortcut: own network, so Spark joins it explicitly; share one network when the bronze job (#7) needs both stacks.
    networks: [kafka]
    # Host clients use localhost:9092 (loopback only); containers use kafka:19092.
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created on purpose (scripts/kafka-smoke.sh), never by a typo in a client.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One broker, so internal topics cannot be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  # Usage: docker compose -f docker/compose.kafka.yml --profile generator run --rm generator --count 10000
  generator:
    build: ../generator
    profiles: [generator]
    networks: [kafka]
    depends_on:
      kafka:
        condition: service_healthy
    # Longer than the producer's 30s flush, so a stop during a slow drain is not SIGKILLed.
    stop_grace_period: 40s

networks:
  kafka:

volumes:
  kafka-data:
