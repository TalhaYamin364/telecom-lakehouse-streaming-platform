name: telecom-hadoop

x-hadoop: &hadoop
  image: telecom-hadoop:3.4.3
  pull_policy: never
  networks: [lakehouse]

services:
  namenode:
    <<: *hadoop
    # The one service that builds the shared image; the others reuse it.
    build:
      context: ./hadoop
      args:
        HADOOP_VERSION: "3.4.3"
    hostname: namenode
    command: ["namenode"]
    ports: ["127.0.0.1:9870:9870"]
    environment:
      HDFS_NAMENODE_OPTS: "-Xmx512m"
    volumes:
      - namenode-data:/data/hdfs/name
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9870/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  datanode1:
    <<: *hadoop
    hostname: datanode1
    command: ["datanode"]
    environment:
      HDFS_DATANODE_OPTS: "-Xmx384m"
    volumes:
      - datanode1-data:/data/hdfs/data
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9864/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  datanode2:
    <<: *hadoop
    hostname: datanode2
    command: ["datanode"]
    environment:
      HDFS_DATANODE_OPTS: "-Xmx384m"
    volumes:
      - datanode2-data:/data/hdfs/data
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9864/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: ["resourcemanager"]
    ports: ["127.0.0.1:8088:8088"]
    environment:
      YARN_RESOURCEMANAGER_OPTS: "-Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/ws/v1/cluster/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nodemanager:
    <<: *hadoop
    hostname: nodemanager
    command: ["nodemanager"]
    environment:
      YARN_NODEMANAGER_OPTS: "-Xmx512m"
    depends_on:
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8042/ws/v1/node/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Spark driver and submit client; run with `--profile spark`. Acts as the HDFS superuser (simple auth, local stack).
  spark-client:
    build: ./spark
    image: telecom-spark:4.0.5
    profiles: [spark]
    networks: [lakehouse]
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      HADOOP_USER_NAME: hadoop
    volumes:
      - ./hadoop/conf:/opt/hadoop-conf:ro
      - ../spark_jobs:/opt/spark_jobs:ro

  # Scheduler for the batch jobs; run with `--profile airflow`. Local use only: the UI is on loopback with no login.
  airflow:
    build:
      context: ./airflow
      additional_contexts:
        telecom-spark:4.0.5: service:spark-client
    image: telecom-airflow:3.1.8
    profiles: [airflow]
    hostname: airflow
    networks: [lakehouse]
    command: ["/opt/airflow-start.sh"]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      HADOOP_USER_NAME: hadoop
      MSISDN_SALT:  # passed through from your shell if set; otherwise silver uses its local dev default
      LAKEHOUSE_SCHEDULE: ${LAKEHOUSE_SCHEDULE:-*/15 * * * *}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    volumes:
      - ./hadoop/conf:/opt/hadoop-conf:ro
      - ../spark_jobs:/opt/spark_jobs:ro
      - ../airflow/dags:/opt/airflow-dags:ro
      - airflow-data:/opt/airflow-home
    depends_on:
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 90s

networks:
  lakehouse:

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  airflow-data:
